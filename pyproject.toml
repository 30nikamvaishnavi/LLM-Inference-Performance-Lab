[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-performance-lab"
version = "0.1.0"
description = "A CPU-first lab for LLM inference engineering and reproducible benchmarking."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "streamlit>=1.38,<2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]
transformers = [
    "transformers>=4.57,<6",
    "tokenizers>=0.22,<1",
    "safetensors>=0.4,<1",
]
datasets = [
    "datasets>=3.0,<5",
]
pytorch = [
    "torch>=2.6,<3",
]
system-metrics = [
    "psutil>=5.9,<8",
]
jax = [
    "jax>=0.4.30,<1",
]
llama-cpp = [
    "llama-cpp-python>=0.3,<1",
]
vllm = [
    "vllm>=0.6,<1; sys_platform == 'linux' and python_version < '3.13'",
]
sglang = [
    "sglang>=0.4,<1; sys_platform == 'linux' and python_version < '3.13'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/datasets/synthetic.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
